name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      
    - name: Pack
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart("v")
        ./scripts/pack-all.ps1 -Configuration Release -Version $version -Clean

    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ vars.NUGET_USER }}
      
    - name: Publish to NuGet
      run: |
        for package in artifacts/nuget/*.nupkg; do
          dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
        done
