name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      
    - name: Pack
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart("v")
        ./scripts/pack-all.ps1 -Configuration Release -Version $version -Clean
      
    - name: Publish to NuGet
      run: dotnet nuget push "artifacts/nuget/*.*nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
